<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="BIS hallmark gold purity certificate">
  <defs>
    <linearGradient id="paperHal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ef"/>
      <stop offset="1" stop-color="#f1e7d8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#paperHal)"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#b89a69" stroke-width="1.5"/>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#b89a69" stroke-width="0.75" opacity="0.55"/>

  <text x="400" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="7" fill="#8F7340">LUMIÈRE JEWELLERY</text>
  <text x="400" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#9a8f7e">BIS HALLMARK</text>
  <line x1="310" y1="170" x2="490" y2="170" stroke="#b89a69" stroke-width="1"/>

  <text x="400" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2622">Purity Certificate</text>
  <text x="400" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6b6257">Assurance of the purity of eligible gold jewellery</text>
  <text x="400" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6b6257">as per applicable BIS standards.</text>

  <circle cx="400" cy="470" r="48" fill="none" stroke="#b89a69" stroke-width="1.25"/>
  <circle cx="400" cy="470" r="39" fill="none" stroke="#b89a69" stroke-width="0.6" opacity="0.7"/>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8F7340">916</text>
  <text x="400" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" letter-spacing="2.5" fill="#9a8f7e">HALLMARK</text>

  <line x1="120" y1="500" x2="300" y2="500" stroke="#c9bda9" stroke-width="1"/>
  <text x="120" y="521" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9a8f7e">Authorised Signatory</text>
</svg>
